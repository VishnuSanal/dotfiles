# Required files
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"

# Optional

auto_update         "yes"
bind_to_address     "0.0.0.0"
port                "6600"
auto_update         "yes"
auto_update_depth   "5"

music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

decoder {
        plugin        "wildmidi"
        enabled       "no"
}

audio_output {
        type            "pulse"
        name            "Local Music Player Daemon"
        always_on       "yes"
}

audio_output {
       type	"fifo"
       name	"Visualizer feed"
       path	"/tmp/mpd.fifo"
       format	"44100:16:2"
}

audio_output {
    type        "httpd"
    name        "MPD Stream"
    encoder     "vorbis"
    port        "8000"
    quality     "5.0"
    format      "44100:16:2"
}
