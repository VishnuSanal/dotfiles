################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1

monitor = eDP-1, addreserved, 10, 10, 10, 10

workspace = 1, monitor:eDP-1, persistent:true
workspace = 2, monitor:eDP-1, persistent:true
workspace = 3, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true
workspace = 5, monitor:eDP-1, persistent:true
workspace = 6, monitor:HDMI-A-1, persistent:true
workspace = 7, monitor:HDMI-A-1, persistent:true
workspace = 8, monitor:HDMI-A-1, persistent:true
workspace = 9, monitor:HDMI-A-1, persistent:true
workspace = 10, monitor:HDMI-A-1, persistent:true

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = pcmanfm
$menu = rofi --show

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = hyprpaper

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 0

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
    # mouse_move_focuses_monitor = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # follow_mouse = 1

    sensitivity = 0

    touchpad {
        disable_while_typing = 1
        natural_scroll = 1
        scroll_factor = 0.5
        clickfinger_behavior = 0
        middle_button_emulation = 0
        tap-to-click = 1
    }
}

gestures {
#    workspace_swipe = true
    workspace_swipe_create_new=true
    workspace_swipe_forever = true
    workspace_swipe_forever=true
}

###################
### KEYBINDINGS ###
###################

bind=SUPER,RETURN,exec,alacritty

bind=SUPER,SPACE,exec,rofi -show

bind=SUPER,X,exec,brave
bind=SUPER,E,exec,pcmanfm
bind=SUPER,C,exec,telegram-desktop
bind=SUPER,G,exec,galculator
bind=,Print,exec,flameshot gui

bind=SUPER_SHIFT,P,exec,pavucontrol
bind=SUPER_SHIFT,W,exec,/opt/brave-bin/brave --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm

bind=SUPER_ALT,B,exec,notify-send "Battery: $(cat /sys/class/power_supply/BAT0/capacity)%"
bind=SUPER_ALT,V,exec,notify-send "Volume: $(pamixer --get-volume)%"
bind=SUPER_ALT,D,exec,notify-send "$(date +%H:%M:%S)"
bind=SUPER_ALT,M,exec,notify-send "$(mpc | head -n 2)"

bind=SUPER_ALT,Q,exec,hyprctl dispatch exit
bind=SUPER_ALT,R,exec,hyprctl reload

bind=SUPER,W,exec,hyprctl dispatch killactive

bind=SUPER,F,fullscreen
bind=SUPER,S,togglefloating

bind=SUPER,H,exec,hyprctl dispatch movefocus l
bind=SUPER,J,exec,hyprctl dispatch movefocus d
bind=SUPER,K,exec,hyprctl dispatch movefocus u
bind=SUPER,L,exec,hyprctl dispatch movefocus r

bind=SUPER_SHIFT,H,exec,hyprctl dispatch swapwindow l
bind=SUPER_SHIFT,J,exec,hyprctl dispatch swapwindow d
bind=SUPER_SHIFT,K,exec,hyprctl dispatch swapwindow u
bind=SUPER_SHIFT,L,exec,hyprctl dispatch swapwindow r

bind=SUPER,D,exec,hyprctl dispatch cyclenext

bind=SUPER,TAB,exec,hyprctl dispatch workspace previous

bind=SUPER,GRAVE,exec, ~/.config/hypr/scripts/cycle.sh
bind=CTRL_SUPER,GRAVE,exec, ~/.config/hypr/scripts/cycle.sh

bind=SUPER,1,exec,hyprctl dispatch workspace 1
bind=SUPER,2,exec,hyprctl dispatch workspace 2
bind=SUPER,3,exec,hyprctl dispatch workspace 3
bind=SUPER,4,exec,hyprctl dispatch workspace 4
bind=SUPER,5,exec,hyprctl dispatch workspace 5
bind=SUPER,6,exec,hyprctl dispatch workspace 6
bind=SUPER,7,exec,hyprctl dispatch workspace 7
bind=SUPER,8,exec,hyprctl dispatch workspace 8
bind=SUPER,9,exec,hyprctl dispatch workspace 9
bind=SUPER,0,exec,hyprctl dispatch workspace 10

bind=SUPER_SHIFT,1,exec,hyprctl dispatch movetoworkspacesilent 1
bind=SUPER_SHIFT,2,exec,hyprctl dispatch movetoworkspacesilent 2
bind=SUPER_SHIFT,3,exec,hyprctl dispatch movetoworkspacesilent 3
bind=SUPER_SHIFT,4,exec,hyprctl dispatch movetoworkspacesilent 4
bind=SUPER_SHIFT,5,exec,hyprctl dispatch movetoworkspacesilent 5
bind=SUPER_SHIFT,6,exec,hyprctl dispatch movetoworkspacesilent 6
bind=SUPER_SHIFT,7,exec,hyprctl dispatch movetoworkspacesilent 7
bind=SUPER_SHIFT,8,exec,hyprctl dispatch movetoworkspacesilent 8
bind=SUPER_SHIFT,9,exec,hyprctl dispatch movetoworkspacesilent 9
bind=SUPER_SHIFT,0,exec,hyprctl dispatch movetoworkspacesilent 10

bind=,XF86AudioLowerVolume,exec,pamixer -d 20 --allow-boost
bind=,XF86AudioRaiseVolume,exec,pamixer -i 20 --allow-boost
bind=,XF86AudioMute,exec,pamixer -t
bind=,XF86AudioPlay,exec,mpc toggle
bind=,XF86AudioPrev,exec,mpc prev
bind=,XF86AudioNext,exec,mpc next
bind=,XF86MonBrightnessUp,exec,backlight -inc 20
bind=,XF86MonBrightnessDown,exec,backlight -dec 20

bind=,XF86Mail,exec,backlight -inc 20
bind=,XF86HomePage,exec,backlight -dec 20

bind = ,mouse:276,exec,~/.config/hypr/scripts/cycle.sh
bind = ,mouse:275,exec,hyprctl dispatch cyclenext

